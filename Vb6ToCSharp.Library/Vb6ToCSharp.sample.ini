; Project-specific rules the converter used to hard-code for the original author's WinCDS project.
; To reproduce that behaviour, merge these sections into VB6toCS.INI (next to Vb6ToCSharp.exe).
;
; [FormRenames]  <vbp Form= entry>=<new name>
; [DataTypes]    <VB type>=<C# type>                       (checked before the built-in mappings)
; [Controls]     <VB control>=<WPF type>[;<container 0|1>;<default property>;<features>]
; [PostCodeLine] <n>=<rule>, applied in order to every converted line; fields separated by '|':
;                replace|find|repl   ifcontains|trigger|find|repl   regex|pattern|repl   blankif|trigger

[DataTypes]
TSPNode=TSPNode
TSPNetwork=TSPNetwork
FindResults=FindResults
Pushpin=Pushpin
Map=Map
SpeechLib.SpeechEngineConfidence=dynamic
XCTransaction2.XChargeTransaction=XCTransaction2.XChargeTransaction

[Controls]
WinCDS.UGridIO=UGridIO
WinCDS.CandyButton=Button
WinCDS.ucPBar=ProgressBar
WinCDS.PrinterSelector=Label
WinCDS.RichTextBoxNew=TextBlock
WinCDS.MaskedPicture=Image

[PostCodeLine]
1=replace|DisposeDA|// DisposeDA
2=ifcontains|IsIn(|ref |
3=ifcontains|POMode(|ref |
4=ifcontains|OrderMode(|ref |
5=ifcontains|InvenMode(|ref |
6=ifcontains|ReportsMode(|ref |
7=ifcontains|SetButtonImage(|ref |
8=ifcontains|SetButtonImage(|.DefaultProperty|
9=ifcontains|EnableFrame|ref |
10=replace| && BackupType.| & BackupType.
11=replace|StoreSettings.|StoreSettings().
12=blankif|SetCustomFrame
13=blankif|RemoveCustomFrame
14=regex|InventFolder([ ,)])|InventFolder()$1
; the original mapped PXFolder/FXFolder to InventFolder() too (kept verbatim)
15=regex|PXFolder([ ,)])|InventFolder()$1
16=regex|FXFolder([ ,)])|InventFolder()$1
17=regex|IsDevelopment([ ,)])|IsDevelopment()$1
